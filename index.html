:root{
  --abyss:#0f4c8a; --deep:#2b8ac6; --foam:#eaf6ff; --jelly:#ff8cc6; --glow:#6ff0da; --sand:#ffd98a; --ink:#041634;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  height:100%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --abyss:#041a3d; --deep:#0c3a78; }
}
:root[data-theme="dark"]{ --abyss:#041a3d; --deep:#0c3a78; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--abyss); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
  background:var(--abyss); color:var(--foam);
  font-family:Nunito, ui-rounded, system-ui, -apple-system, sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{ position:relative; height:100%; max-width:480px; margin:0 auto; touch-action:none; overflow:hidden; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hud{
  position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
  padding:10px 12px; pointer-events:none; font-weight:800;
}
.hud .score{ font-family:Bungee, Impact, sans-serif; font-size:24px; letter-spacing:.02em; text-shadow:0 2px 0 var(--ink); }
.hud .wave{ font-size:15px; opacity:.85; }
.hud .spacer{ flex:1; }
.icon{
  pointer-events:auto; touch-action:manipulation;
  width:42px; height:42px; border-radius:50%;
  border:2px solid rgba(234,246,255,.35); background:rgba(4,22,52,.35);
  color:var(--foam); font:800 16px Nunito, system-ui, sans-serif; display:grid; place-items:center; cursor:pointer;
}
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px; background:rgba(4,22,52,.55);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
}
.overlay[hidden]{ display:none; }
h1{
  font-family:Bungee, Impact, sans-serif; font-weight:400;
  font-size:clamp(46px,15vw,68px); margin:0; line-height:.95; color:var(--jelly);
  text-shadow:0 5px 0 var(--ink), 0 0 28px rgba(255,140,198,.55);
}
h2{ font-family:Bungee, Impact, sans-serif; font-weight:400; font-size:34px; margin:0; color:var(--sand); text-shadow:0 4px 0 var(--ink); }
.overlay p{ max-width:28ch; font-size:17px; line-height:1.45; margin:14px 0 24px; }
.play{
  touch-action:manipulation; cursor:pointer;
  font-family:Bungee, Impact, sans-serif; font-size:22px; padding:14px 36px; border-radius:999px; border:0;
  background:var(--sand); color:var(--ink); box-shadow:0 5px 0 #c9953a;
}
.play:active{ transform:translateY(3px); box-shadow:0 2px 0 #c9953a; }
button:focus-visible{ outline:3px solid var(--glow); outline-offset:3px; }
.best{ font-size:15px; opacity:.8; margin-top:18px; }
@media (prefers-reduced-motion: reduce){ .play:active{ transform:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud">
    <span class="score" id="score">0</span>
    <span class="wave" id="wave">Wave 1</span>
    <span class="spacer"></span>
    <button class="icon" id="mute" aria-label="Mute sound">🔊</button>
    <button class="icon" id="pause" aria-label="Pause">❚❚</button>
  </div>

  <div class="overlay" id="title">
    <h1>Jelly<br>fall</h1>
    <p>A bloom of jellyfish is drifting down on your reef. Drag anywhere to steer your sub. Keep a finger down to fire bubbles.</p>
    <button class="play" id="start">Play</button>
    <div class="best" id="bestTitle"></div>
  </div>

  <div class="overlay" id="paused" hidden>
    <h2>Paused</h2>
    <p>Your sub is holding position.</p>
    <button class="play" id="resume">Resume</button>
  </div>

  <div class="overlay" id="over" hidden>
    <h2 id="overHead">Reef overrun</h2>
    <p id="overText"></p>
    <button class="play" id="again">Play again</button>
    <div class="best" id="bestOver"></div>
  </div>
</div>

<script>
(() => {
const W = 360;
let H = 640, scale = 1, dpr = 1;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

const SAND = '#ffd98a', FOAM = '#eaf6ff', INK = '#041634', GLOW = '#6ff0da';
const JCOL = ['#ff8cc6', '#b79bff', '#ffd98a'];
const JPTS = [10, 20, 30];
const CORAL = ['#ff7f6e', '#ff9e7a', '#ff7f6e', '#ff9e7a'];
let bgTop = '#0c3a78', bgBot = '#041a3d';

function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  bgTop = cs.getPropertyValue('--deep').trim() || bgTop;
  bgBot = cs.getPropertyValue('--abyss').trim() || bgBot;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- state ----------
let state = 'title';
let score = 0, best = 0, lives = 3, wave = 1, t = 0;
let player = { x: W / 2, y: H - 64 };
let shots = [], stings = [], jellies = [], reefs = [], parts = [], popups = [];
let angler = null, anglerTimer = 15, stingTimer = 1.5;
let form = { x: 0, y: 70, dir: 1 };
let fireCd = 0, invuln = 0, waveBanner = 0;
const snow = Array.from({ length: 45 }, () => ({ x: Math.random() * W, y: Math.random() * 900, r: rand(.5, 1.6), s: rand(4, 12) }));

try { best = +localStorage.getItem('jellyfall-best') || 0; } catch (e) {}

function resize(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.round(r.width * dpr);
  cvs.height = Math.round(r.height * dpr);
  scale = r.width / W;
  H = Math.max(480, r.height / scale);
  player.y = H - 64;
  readTheme();
}
window.addEventListener('resize', resize);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme); } catch (e) {}

// ---------- audio ----------
let ac = null, muted = false;
try { muted = localStorage.getItem('jellyfall-muted') === '1'; } catch (e) {}
function initAudio(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f, d, type = 'sine', v = .07, f2){
  if (!ac || muted) return;
  const now = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
  g.gain.setValueAtTime(v, now); g.gain.exponentialRampToValueAtTime(.0001, now + d);
  o.connect(g).connect(ac.destination); o.start(now); o.stop(now + d + .02);
}

// ---------- setup ----------
function buildReefs(){
  reefs = [];
  const cw = 11, ch = 7, cs = 4, y = H - 150;
  for (let i = 0; i < 4; i++){
    const cx = W * (i + .5) / 4, cells = [];
    for (let r = 0; r < ch; r++) for (let c = 0; c < cw; c++){
      let on = true;
      if (r < 2 && (c < 2 - r || c > cw - 3 + r)) on = false;
      if (r >= 5 && c >= 4 && c <= 6) on = false;
      cells.push(on);
    }
    reefs.push({ x: cx - cw * cs / 2, y, cw, ch, cs, cells, i });
  }
}

function newWave(){
  jellies = [];
  const cols = 8, rows = 5, sp = 34;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    jellies.push({ cx: c * sp, cy: r * 30, type: r === 0 ? 2 : r < 3 ? 1 : 0, alive: true, ph: Math.random() * 6 });
  form = { x: (W - (cols - 1) * sp) / 2, y: 80 + Math.min(wave - 1, 5) * 8, dir: 1 };
  shots = []; stings = []; angler = null;
  anglerTimer = rand(12, 22); stingTimer = 1.5;
  buildReefs();
  waveBanner = 1.8;
  updateHud();
}

function startGame(){
  initAudio();
  score = 0; lives = 3; wave = 1; invuln = 0; parts = []; popups = [];
  player.x = W / 2;
  newWave();
  setState('play');
}

function setState(s){
  state = s;
  $('title').hidden = s !== 'title';
  $('paused').hidden = s !== 'paused';
  $('over').hidden = s !== 'over';
  $('pause').textContent = s === 'paused' ? '▶' : '❚❚';
  $('pause').setAttribute('aria-label', s === 'paused' ? 'Resume' : 'Pause');
  touching = false;
}

function updateHud(){
  $('score').textContent = score;
  $('wave').textContent = 'Wave ' + wave;
}

function gameOver(reason){
  if (score > best){ best = score; try { localStorage.setItem('jellyfall-best', best); } catch (e) {} }
  $('overHead').textContent = reason;
  $('overText').textContent = `You scored ${score} and made it to wave ${wave}.`;
  $('bestOver').textContent = 'Best: ' + best;
  tone(220, .8, 'sawtooth', .07, 40);
  setState('over');
}

// ---------- input ----------
let touching = false, lastPX = 0;
const keys = {};
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  initAudio();
  touching = true; lastPX = e.clientX;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
cvs.addEventListener('pointermove', e => {
  if (!touching) return;
  player.x = clamp(player.x + (e.clientX - lastPX) / scale * 1.35, 20, W - 20);
  lastPX = e.clientX;
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cvs.addEventListener(ev, () => { touching = false; }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' ', 'a', 'd'].includes(e.key)){ keys[e.key] = true; if (state === 'play') e.preventDefault(); }
  if (e.key === 'p' || e.key === 'Escape') togglePause();
});
addEventListener('keyup', e => { keys[e.key] = false; });

function togglePause(){
  if (state === 'play') setState('paused');
  else if (state === 'paused') setState('play');
}
$('pause').onclick = togglePause;
$('resume').onclick = () => setState('play');
$('start').onclick = startGame;
$('again').onclick = startGame;
$('mute').onclick = () => {
  muted = !muted;
  try { localStorage.setItem('jellyfall-muted', muted ? '1' : '0'); } catch (e) {}
  $('mute').textContent = muted ? '🔇' : '🔊';
  $('mute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
};
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('paused'); });

// ---------- haptics (native app only) ----------
let Haptics = null;
try {
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()) Haptics = (C.Plugins && C.Plugins.Haptics) || (C.registerPlugin && C.registerPlugin('Haptics'));
} catch (e) {}
function buzz(style){ try { if (Haptics) Haptics.impact({ style }); } catch (e) {} }

// ---------- helpers ----------
function burst(x, y, color, n = 14, sp = 90){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = rand(.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, .8), max: .8, color, r: rand(1, 2.6) });
  }
}

function hitReef(x, y, blast){
  for (const f of reefs){
    const c = Math.floor((x - f.x) / f.cs), r = Math.floor((y - f.y) / f.cs);
    if (c < 0 || r < 0 || c >= f.cw || r >= f.ch) continue;
    if (f.cells[r * f.cw + c]){
      for (let dr = -blast; dr <= blast; dr++) for (let dc = -blast; dc <= blast; dc++){
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && cc >= 0 && rr < f.ch && cc < f.cw && (Math.abs(dr) + Math.abs(dc) <= blast || Math.random() < .35))
          f.cells[rr * f.cw + cc] = false;
      }
      burst(x, y, CORAL[f.i], 5, 50);
      return true;
    }
  }
  return false;
}

function jellyPos(j){ return [form.x + j.cx, form.y + j.cy]; }

function hurtPlayer(){
  lives--;
  burst(player.x, player.y, SAND, 26, 140);
  tone(160, .45, 'sawtooth', .08, 40);
  buzz('HEAVY');
  stings = [];
  invuln = 2.2;
  if (lives <= 0) gameOver('Sub down');
}

// ---------- update ----------
function update(dt){
  if (waveBanner > 0) waveBanner -= dt;
  fireCd -= dt; invuln -= dt;

  let mv = 0;
  if (keys.ArrowLeft || keys.a) mv -= 1;
  if (keys.ArrowRight || keys.d) mv += 1;
  player.x = clamp(player.x + mv * 230 * dt, 20, W - 20);

  if ((touching || keys[' ']) && fireCd <= 0 && shots.length < 3){
    shots.push({ x: player.x + 2, y: player.y - 20 });
    fireCd = .28;
    tone(600, .09, 'sine', .045, 1300);
  }

  // player shots
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    let dead = false;
    const dist = 440 * dt, steps = Math.ceil(dist / 3);
    for (let k = 0; k < steps && !dead; k++){
      s.y -= dist / steps;
      if (s.y < -10){ dead = true; break; }
      if (hitReef(s.x, s.y, 1)){ dead = true; break; }
      for (const j of jellies){
        if (!j.alive) continue;
        const [jx, jy] = jellyPos(j);
        if (Math.abs(s.x - jx) < 13 && Math.abs(s.y - jy) < 13){
          j.alive = false; dead = true;
          score += JPTS[j.type];
          burst(jx, jy, JCOL[j.type]);
          tone(320, .14, 'triangle', .08, 90);
          buzz('LIGHT');
          break;
        }
      }
      if (dead) break;
      if (angler && Math.abs(s.x - angler.x) < 22 && Math.abs(s.y - angler.y) < 13){
        const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
        score += pts;
        popups.push({ x: angler.x, y: angler.y, text: '+' + pts, life: 1.2 });
        burst(angler.x, angler.y, SAND, 24, 120);
        tone(900, .3, 'square', .04, 200);
        buzz('MEDIUM');
        angler = null; dead = true; break;
      }
      for (let m = stings.length - 1; m >= 0; m--){
        const g = stings[m];
        if (Math.abs(s.x - g.x) < 6 && Math.abs(s.y - g.y) < 10){
          stings.splice(m, 1); dead = true;
          burst(g.x, g.y, GLOW, 6, 60);
          break;
        }
      }
    }
    if (dead) shots.splice(i, 1);
  }

  // formation
  const alive = jellies.filter(j => j.alive);
  if (!alive.length){
    wave++;
    if (wave % 2 === 1 && lives < 5){ lives++; popups.push({ x: W / 2, y: H / 2 + 40, text: 'Extra sub!', life: 1.6 }); }
    tone(520, .15, 'triangle', .06, 780);
    setTimeout(() => tone(780, .25, 'triangle', .06, 1040), 140);
    newWave();
    return;
  }
  const speed = 14 + wave * 4 + (40 - alive.length) * 1.7;
  form.x += form.dir * speed * dt;
  let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const j of alive){ minX = Math.min(minX, j.cx); maxX = Math.max(maxX, j.cx); maxY = Math.max(maxY, j.cy); }
  if (form.dir > 0 && form.x + maxX > W - 20){ form.x = W - 20 - maxX; form.dir = -1; form.y += 14; }
  else if (form.dir < 0 && form.x + minX < 20){ form.x = 20 - minX; form.dir = 1; form.y += 14; }

  // jellies crush reef cells they touch
  for (const j of alive){
    const [jx, jy] = jellyPos(j);
    for (const f of reefs){
      if (jy + 14 < f.y || jy - 12 > f.y + f.ch * f.cs) continue;
      for (let r = 0; r < f.ch; r++) for (let c = 0; c < f.cw; c++){
        const px = f.x + c * f.cs, py = f.y + r * f.cs;
        if (Math.abs(px - jx) < 13 && Math.abs(py - jy) < 14) f.cells[r * f.cw + c] = false;
      }
    }
  }
  if (form.y + maxY + 14 >= player.y - 14){ gameOver('Reef overrun'); return; }

  // stings
  stingTimer -= dt;
  if (stingTimer <= 0 && stings.length < 3 + wave){
    const cols = {};
    for (const j of alive){ if (!cols[j.cx] || cols[j.cx].cy < j.cy) cols[j.cx] = j; }
    const bottoms = Object.values(cols);
    const shooter = Math.random() < .35
      ? bottoms.reduce((a, b) => Math.abs(form.x + a.cx - player.x) < Math.abs(form.x + b.cx - player.x) ? a : b)
      : bottoms[Math.floor(Math.random() * bottoms.length)];
    const [sx, sy] = jellyPos(shooter);
    stings.push({ x: sx, y: sy + 12 });
    stingTimer = rand(.45, 1.4) / (1 + wave * .18);
  }
  const sSpeed = 150 + wave * 12;
  for (let i = stings.length - 1; i >= 0; i--){
    const g = stings[i];
    g.y += sSpeed * dt;
    if (g.y > H - 36 || hitReef(g.x, g.y + 6, 1)){ stings.splice(i, 1); continue; }
    if (invuln <= 0 && Math.abs(g.x - player.x) < 16 && g.y > player.y - 14 && g.y < player.y + 10){
      stings.splice(i, 1);
      hurtPlayer();
      if (state !== 'play') return;
    }
  }

  // angler
  anglerTimer -= dt;
  if (!angler && anglerTimer <= 0){
    const dir = Math.random() < .5 ? 1 : -1;
    angler = { x: dir > 0 ? -30 : W + 30, y: 50, dir };
    anglerTimer = rand(15, 25);
  }
  if (angler){
    angler.x += angler.dir * 70 * dt;
    if (angler.x < -40 || angler.x > W + 40) angler = null;
  }

  updateHud();
}

function updateAmbient(dt){
  t += dt;
  for (const s of snow){ s.y += s.s * dt; s.x += Math.sin(t + s.y * .02) * 3 * dt; if (s.y > H) { s.y = -5; s.x = Math.random() * W; } }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--){ popups[i].y -= 20 * dt; popups[i].life -= dt; if (popups[i].life <= 0) popups.splice(i, 1); }
}

// ---------- draw ----------
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawJelly(x, y, type, ph){
  const col = JCOL[type], pulse = Math.sin(t * 4 + ph);
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = .18; ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++){
    const bx = i * 4;
    ctx.beginPath(); ctx.moveTo(bx, 1);
    ctx.quadraticCurveTo(bx + Math.sin(t * 6 + ph + i) * 3, 8, bx + Math.sin(t * 6 + ph + i + 1) * 2.5, 13 + (i % 2 ? 2 : 0));
    ctx.stroke();
  }
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, -1, 11 + pulse * .6, 9 - pulse * .6, 0, Math.PI, 0);
  ctx.lineTo(11 + pulse * .6, 2);
  ctx.quadraticCurveTo(0, 5 + pulse, -11 - pulse * .6, 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(-4, -6, 3.5, 2, -.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(-3.5, -2, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5, -2, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSub(x, y, s = 1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = SAND;
  rr(-6, -15, 13, 10, 3); ctx.fill();
  ctx.fillRect(1, -22, 2.6, 8); ctx.fillRect(1, -22, 6.5, 2.6);
  rr(-18, -8, 34, 16, 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -2); ctx.lineTo(22, -7); ctx.lineTo(22, 7); ctx.lineTo(15, 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c9953a'; ctx.fillRect(-18, 3, 34, 2);
  ctx.fillStyle = bgTop; ctx.strokeStyle = '#c9953a'; ctx.lineWidth = 1.5;
  for (const px of [-9, 0]){ ctx.beginPath(); ctx.arc(px, -1, 3.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

function drawAngler(a){
  ctx.save(); ctx.translate(a.x, a.y); ctx.scale(-a.dir, 1);
  ctx.strokeStyle = '#8f7fd6'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, -9); ctx.quadraticCurveTo(-14, -24, -24, -14); ctx.stroke();
  const glow = .6 + Math.sin(t * 8) * .4;
  ctx.fillStyle = `rgba(255,217,138,${.25 * glow})`; ctx.beginPath(); ctx.arc(-24, -13, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SAND; ctx.beginPath(); ctx.arc(-24, -13, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5b4aa8';
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(26, -8); ctx.lineTo(26, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(-18, 1); ctx.lineTo(-6, 3); ctx.lineTo(-17, 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = FOAM;
  for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.moveTo(-16 + i * 3.5, 2); ctx.lineTo(-14.5 + i * 3.5, 5); ctx.lineTo(-13 + i * 3.5, 2.4); ctx.fill(); }
  ctx.beginPath(); ctx.arc(-9, -4, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-9.5, -4, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, bgTop); g.addColorStop(1, bgBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // light rays
  ctx.save(); ctx.globalAlpha = .06; ctx.fillStyle = FOAM;
  for (let i = 0; i < 3; i++){
    const x = 60 + i * 120 + Math.sin(t * .3 + i * 2) * 25;
    ctx.beginPath(); ctx.moveTo(x - 18, 0); ctx.lineTo(x + 18, 0); ctx.lineTo(x + 70, H * .8); ctx.lineTo(x + 10, H * .8); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(234,246,255,.35)';
  for (const s of snow){ ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }

  // seafloor
  const floor = H - 36;
  ctx.fillStyle = '#d9b36a';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, floor + Math.sin(x * .05) * 3);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  if (state !== 'title') for (let i = 0; i < lives - 1; i++) drawSub(22 + i * 26, H - 16, .5);

  // reefs
  for (const f of reefs){
    ctx.fillStyle = CORAL[f.i];
    for (let r = 0; r < f.ch; r++) for (let c = 0; c < f.cw; c++)
      if (f.cells[r * f.cw + c]) ctx.fillRect(f.x + c * f.cs, f.y + r * f.cs, f.cs - .5, f.cs - .5);
  }

  for (const j of jellies) if (j.alive){ const [x, y] = jellyPos(j); drawJelly(x, y, j.type, j.ph); }
  if (angler) drawAngler(angler);

  // stings
  ctx.strokeStyle = GLOW; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of stings){
    ctx.beginPath(); ctx.moveTo(s.x, s.y - 6);
    const w = Math.sin(t * 20 + s.y) > 0 ? 3 : -3;
    ctx.lineTo(s.x + w, s.y - 2); ctx.lineTo(s.x - w, s.y + 2); ctx.lineTo(s.x, s.y + 6); ctx.stroke();
  }

  // bubbles
  for (const s of shots){
    ctx.strokeStyle = FOAM; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(234,246,255,.8)'; ctx.beginPath(); ctx.arc(s.x - 1.3, s.y - 1.3, 1.1, 0, Math.PI * 2); ctx.fill();
  }

  if (state !== 'title' && lives > 0 && (invuln <= 0 || Math.floor(t * 10) % 2 === 0)) drawSub(player.x, player.y);

  for (const p of parts){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups){
    ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = SAND;
    ctx.font = '800 16px Nunito, system-ui, sans-serif'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (state === 'play' && waveBanner > 0){
    ctx.globalAlpha = clamp(waveBanner, 0, 1);
    ctx.font = '30px Bungee, Impact, sans-serif'; ctx.fillStyle = FOAM;
    ctx.fillText('Wave ' + wave, W / 2, H * .5);
    ctx.globalAlpha = 1;
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  if (state === 'play') update(dt);
  if (state !== 'paused') updateAmbient(dt);
  if (state === 'title'){ form.x += form.dir * 18 * dt; if (form.x + 238 > W - 20 || form.x < 20) form.dir *= -1; }
  draw();
  requestAnimationFrame(frame);
}

resize();
newWave();
$('mute').textContent = muted ? '🔇' : '🔊';
$('bestTitle').textContent = best ? 'Best: ' + best : '';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
